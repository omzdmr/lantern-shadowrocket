name: Update free Shadowrocket subscription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-free-sub.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public subscription
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl --fail --location --retry 3 --connect-timeout 15 \
            'https://raw.githubusercontent.com/XSVPN/Pawdroid-Free-servers/main/sub' \
            -o output/sub.txt
          test -s output/sub.txt

      - name: Commit only when changed
        shell: bash
        run: |
          if git diff --quiet -- output/sub.txt; then
            echo 'No change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/sub.txt
          git commit -m 'chore: refresh free subscription'
          git push
