name: Update free Shadowrocket subscription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-free-sub.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified modern subscription
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output tmp

          # These are config bundles, not the subs/all.txt source-link catalog.
          sources=(
            'https://raw.githubusercontent.com/morpheusadam/v2ray-config/main/subs/bundles/reality.txt'
            'https://raw.githubusercontent.com/morpheusadam/v2ray-config/main/subs/bundles/hysteria2.txt'
            'https://raw.githubusercontent.com/morpheusadam/v2ray-config/main/subs/bundles/tuic.txt'
            'https://raw.githubusercontent.com/morpheusadam/v2ray-config/main/subs/bundles/trojan.txt'
            'https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/hysteria2.txt'
            'https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt'
            'https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/trojan.txt'
          )

          : > tmp/all.txt
          ok=0
          for i in "${!sources[@]}"; do
            url="${sources[$i]}"
            f="tmp/src-$i.txt"
            if curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 "$url" -o "$f" && test -s "$f"; then
              cat "$f" >> tmp/all.txt
              printf '\n' >> tmp/all.txt
              ok=$((ok+1))
            fi
          done
          test "$ok" -ge 2

          # Preserve only raw proxy URIs Shadowrocket can import.
          grep -aE '^(vless|hysteria2|hy2|tuic|trojan)://' tmp/all.txt \
            | sed '/^[[:space:]]*$/d' \
            | awk '!seen[$0]++' \
            > output/sub.txt

          count=$(wc -l < output/sub.txt)
          echo "Published $count candidates from $ok feeds."
          # A green workflow with an empty/tiny subscription is a failure.
          test "$count" -ge 20

      - name: Commit only when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- output/sub.txt)" ]; then
            echo 'No change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/sub.txt
          git commit -m 'chore: refresh verified modern subscription'
          git push
